rules:
  # Bronze
  action-setup:
    status: done
    comment: pyronix_cloud.force_arm is registered in async_setup (services.py).
  appropriate-polling: done
  brands:
    status: todo
    comment: |
      The icons ship in brand/ (read by HA 2026.3+), but the rule needs them in
      the home-assistant/brands repository: open a PR adding
      core_integrations/pyronix_cloud/ there (a user action).
  common-modules: done
  config-flow-test-coverage: done
  config-flow: done
  dependency-transparency:
    status: done
    comment: |
      pyronix-cloud (LGPL-3.0-or-later) is published to PyPI by the public
      release.yml workflow with Trusted Publishing; each version matches a
      v* tag in this repository.
  docs-actions:
    status: done
    comment: The README section "Arming and force arming" documents force_arm.
  docs-conditions:
    status: exempt
    comment: This integration does not provide any conditions.
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions: done
  docs-triggers:
    status: exempt
    comment: This integration does not provide any triggers.
  entity-event-setup:
    status: exempt
    comment: |
      Entities do not subscribe to events; they read the coordinator. The only
      extra listener (new inputs) is set up in async_setup_entry and removed
      with entry.async_on_unload.
  entity-unique-id: done
  has-entity-name: done
  runtime-data: done
  test-before-configure: done
  test-before-setup: done
  unique-config-entry: done

  # Silver
  action-exceptions: done
  config-entry-unloading: done
  docs-configuration-parameters: done
  docs-installation-parameters: done
  entity-unavailable: done
  integration-owner: done
  log-when-unavailable: done
  parallel-updates: done
  reauthentication-flow: done
  test-coverage: done

  # Gold
  devices: done
  diagnostics: done
  discovery-update-info:
    status: exempt
    comment: The panel is reached only through the Pyronix Cloud; nothing to discover.
  discovery:
    status: exempt
    comment: |
      The panel is reached only through the Pyronix Cloud relay by System ID;
      it does not announce itself on the local network.
  docs-data-update: done
  docs-examples: done
  docs-known-limitations: done
  docs-supported-devices: done
  docs-supported-functions: done
  docs-troubleshooting: done
  docs-use-cases: done
  dynamic-devices:
    status: done
    comment: |
      The panel is one device; inputs that appear in a later snapshot get
      binary sensors added at runtime (tested in test_binary_sensor.py).
  entity-category: done
  entity-device-class: done
  entity-disabled-by-default: done
  entity-translations: done
  exception-translations: done
  icon-translations: done
  reconfiguration-flow: done
  repair-issues:
    status: done
    comment: |
      Entries without an arm/disarm access rule raise a repair issue that asks
      an admin to choose one (access_issue.py). Rejected credentials start the
      reauthentication flow instead.
  stale-devices:
    status: exempt
    comment: |
      The integration has a single device, the panel. Input entities the panel
      no longer reports are not removed automatically (follow-up).

  # Platinum
  async-dependency: done
  inject-websession: done
  strict-typing: done
