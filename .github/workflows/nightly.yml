# Long-running test jobs that are too slow for every push.
name: Nightly

on:
  schedule:
    - cron: "17 3 * * *" # daily: Hypothesis
    - cron: "41 4 * * 0" # weekly (Sunday): mutation testing
  workflow_dispatch:
    inputs:
      mutation:
        description: Also run mutation testing (slow)
        type: boolean
        default: false

permissions:
  contents: read

# The daily and weekly schedules share this group: queue, never cancel each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  hypothesis:
    name: Hypothesis (nightly profile, Python 3.14)
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '17 3 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.14"
      - run: uv sync --frozen
      # Only the property tests (Hypothesis marks them `hypothesis`), with thousands of
      # random examples each. A subset cannot meet the coverage gate, and the per-test
      # timeout is sized for the default profile, so both are off here.
      - name: Property tests, nightly profile
        env:
          HYPOTHESIS_PROFILE: nightly
        run: uv run pytest -m hypothesis --no-cov --timeout=0
      # The example database replays a failure locally: copy it to .hypothesis/ and
      # rerun the failing test with HYPOTHESIS_PROFILE=nightly.
      - name: Upload failing examples
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hypothesis-examples
          path: .hypothesis/examples/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30

  mutation:
    name: Mutation testing (report only)
    if: >-
      github.event.schedule == '41 4 * * 0' ||
      (github.event_name == 'workflow_dispatch' && inputs.mutation)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    # Surviving mutants are a to-do list for the tests, not a gate.
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.14"
      - run: uv sync --frozen
      # Modules and tests come from [tool.mutmut] in pyproject.toml. mutmut exits
      # non-zero when mutants survive; the summary below is the output that matters.
      - name: Run mutmut
        run: uv run mutmut run || true
      - name: Summarise surviving mutants
        if: always()
        run: |
          {
            echo '## Surviving mutants'
            echo '```'
            uv run mutmut results
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
