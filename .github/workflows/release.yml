name: Release

# Publishes the pyronix-cloud library when a version tag is pushed. Uses PyPI Trusted
# Publishing (OIDC): no API token is stored. One-time setup on test.pypi.org and pypi.org:
# add a trusted publisher for this repository, workflow "release.yml", and environments
# "testpypi" and "pypi" respectively. Create both environments in the GitHub repository
# settings (add required reviewers to "pypi" for a manual gate).

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.13"
      - name: Tag must match the project version
        run: |
          version="$(uv run --frozen --no-sync python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          test "v${version}" = "${GITHUB_REF_NAME}" || {
            echo "::error::tag ${GITHUB_REF_NAME} does not match pyproject version ${version}"
            exit 1
          }
      - run: uv build
      - name: Check distribution metadata
        run: uvx twine@7.0.0 check --strict dist/*
      - name: Check wheel contents
        run: uvx check-wheel-contents@0.6.3 dist/*.whl
      # The library dists must never carry the HA integration, vendor material, secrets
      # or captures. The hatch config restricts what is packed; this proves it.
      - name: Distributions contain no forbidden paths
        run: |
          set -euo pipefail
          for sdist in dist/*.tar.gz; do tar -tzf "${sdist}"; done > dist-files.txt
          for wheel in dist/*.whl; do unzip -Z1 "${wheel}"; done >> dist-files.txt
          cat dist-files.txt
          pattern='(^|/)(apk|decompiled|reference|custom_components)/|(^|/)\.env$|(^|/)\.device_id$|\.(log|pcap|pcapng)$'
          if grep -E "${pattern}" dist-files.txt; then
            echo "::error::forbidden paths in the distributions (listed above)"
            exit 1
          fi
          rm dist-files.txt
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  testpypi:
    name: Publish to TestPyPI
    needs: build
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@v1.14.3
        with:
          repository-url: https://test.pypi.org/legacy/

  pypi:
    name: Publish to PyPI
    needs: testpypi
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@v1.14.3
